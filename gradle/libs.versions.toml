## Version catalog — single source of truth for every dependency and plugin version.
##
## IMPORTANT (compileSdk 37 decision):
## Every AndroidX artifact declares a `minCompileSdk` inside its AAR metadata
## (`META-INF/com/android/build/gradle/aar-metadata.properties`). Gradle fails the build when
## that value is greater than `android-compileSdk`, so the highest requirement across the whole
## dependency graph sets the floor. Verified by downloading the AARs and reading the property:
##   * androidx.lifecycle:lifecycle-runtime-compose 2.11.0 -> minCompileSdk 37  <-- the binding one
##   * androidx.activity:activity(-compose)        1.11.0 -> minCompileSdk 36
##   * io.coil-kt.coil3:coil-compose               3.5.0  -> minCompileSdk 36
##   * androidx.core:core                          1.18.0 -> minCompileSdk 36
##   * androidx.compose.* (ui/foundation/material3, via Compose Multiplatform 1.11.1 / Jetpack 1.11.2) -> 34-35
##   * androidx.navigation:navigation-compose      2.9.7  -> minCompileSdk 35
##   * org.jetbrains.androidx.lifecycle / koin / supabase / multiplatform-settings -> 1-34
## Therefore `android-compileSdk` / `android-targetSdk` are pinned to 37 and every library below
## is kept on the newest stable release that fits that floor.

[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.11.0"
# Credential Manager (Android Google Sign-In). `credentials-play-services-auth` backports the
# flow to devices running Android 13 and below; both artifacts share the same version.
androidx-credentials = "1.6.0"
# Multiplatform lifecycle artifacts (org.jetbrains.androidx.lifecycle) mapping to
# AndroidX lifecycle 2.11.0. `lifecycle-runtime-compose` is what requires compileSdk 37.
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.9.2"
coil = "3.5.0"
compose-material-icons = "1.7.3"
compose-material3 = "1.11.0-alpha07"
compose-multiplatform = "1.11.1"
googleid = "1.2.1"
haze = "1.7.2"
koin = "4.2.2"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
ktor = "3.5.1"
multiplatform-settings = "1.3.0"
supabase = "3.8.0"
turbine = "1.2.1"

[libraries]
# --- AndroidX / Android ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }

# --- Google Sign-In (Credential Manager, Android only) ---
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# --- Compose Multiplatform ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }

# --- Backdrop blur (floating bottom bar) ---
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# --- Navigation ---
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# --- Koin (DI) ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# --- Ktor (HTTP client) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- Supabase (Kotlin Multiplatform SDK) ---
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabase" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt", version.ref = "supabase" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt", version.ref = "supabase" }

# --- Images ---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# --- kotlinx ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# --- Key/value storage (multiplatform) ---
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }

# --- Testing ---
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
